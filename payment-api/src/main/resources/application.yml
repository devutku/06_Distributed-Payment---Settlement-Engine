server:
  port: 8080

spring:
  application:
    name: distributed-payment-core

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/settlement_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: settlement-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        # The outbox publisher waits for every send (see KafkaTransferEventPublisher).
        # Short timeouts make a send during a broker outage fail definitively, instead of
        # sitting in the producer buffer and being delivered late as a duplicate after the
        # outbox has already given up and queued a retry.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

mutabik:
  security:
    issuer: ${MUTABIK_SECURITY_ISSUER:http://localhost:8180/realms/mutabik}
    jwk-set-uri: ${MUTABIK_SECURITY_JWK_SET_URI:${mutabik.security.issuer}/protocol/openid-connect/certs}
    audience: ${MUTABIK_SECURITY_AUDIENCE:mutabik-api}

management:
  # Actuator lives on its own internal port; the application port (8080) exposes no actuator.
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        payment.transfer.duration: true
      percentiles:
        payment.transfer.duration: 0.5, 0.9, 0.95, 0.99

